name: Windows installer build (unsigned)

# 每次推 main/master 只做构建 + 校验 + 上传 artifact；只有打 v* 标签（或手动勾选 release）
# 才会发 GitHub Release。Release 里只有未签名的 NSIS 安装包和 SHA256SUMS。
on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Also run the Windows Electron smoke test (installs ffmpeg, uses more minutes)
        type: boolean
        default: false
      release:
        description: Publish/refresh the GitHub Release for the current version tag
        type: boolean
        default: false
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Electron 和 electron-builder 的二进制很大，缓存能省好几分钟
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Offline unit tests
        run: npm test

      - name: Build Windows installer (NSIS)
        run: npm run dist:win

      - name: Verify installer (static, no execution)
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/win-x64/*.exe | Select-Object -First 1
          if (-not $exe) { throw 'no NSIS installer was produced' }
          npm run test:windows-installer -- $exe.FullName

      - name: Write SHA256SUMS
        run: node scripts/release-checksums.mjs release/win-x64

      - name: Show checksums
        shell: pwsh
        run: Get-Content release/win-x64/SHA256SUMS

      # 真实 Electron 运行时的冒烟测试需要 ffmpeg 造音频夹具，runner 上没预装；
      # 默认不跑（上面的静态校验已经守住了产物），手动勾 smoke 才跑。
      - name: Install ffmpeg for audio fixtures
        if: ${{ inputs.smoke == true }}
        run: choco install ffmpeg -y --no-progress

      - name: Windows Electron smoke (optional)
        if: ${{ inputs.smoke == true }}
        continue-on-error: true
        run: npm run test:electron

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release == true }}
        shell: pwsh
        # Keep this block ASCII-only: Chinese text inside a PowerShell run block can be mangled
        # by the Windows runner's code page. Release notes live in .github/release-notes.md.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { "v$version" }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $tag -ne "v$version") {
            throw "tag $tag does not match package.json version v$version"
          }
          $exe = (Get-ChildItem release/win-x64/*.exe | Select-Object -First 1).FullName
          $sums = (Resolve-Path release/win-x64/SHA256SUMS).Path
          $notes = (Resolve-Path .github/release-notes.md).Path
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            # Drop stale installers so nobody downloads an outdated build.
            gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets -q '.assets[].name' |
              Where-Object { $_ -like '*.exe' } |
              ForEach-Object { gh release delete-asset $tag $_ --repo $env:GITHUB_REPOSITORY -y }
            gh release upload $tag --repo $env:GITHUB_REPOSITORY $exe $sums --clobber
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
              --title "huawei-music-win $tag - unsigned Windows installer" --notes-file $notes $exe $sums
          }

      - uses: actions/upload-artifact@v4
        if: ${{ !(startsWith(github.ref, 'refs/tags/') || inputs.release == true) }}
        with:
          name: huawei-music-windows-x64-unofficial
          path: |
            release/win-x64/*.exe
            release/win-x64/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
